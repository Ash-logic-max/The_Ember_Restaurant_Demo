<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE EMBER — Where Every Meal Becomes a Memory</title>
<meta name="description" content="THE EMBER — a premium restaurant experience. Frontend demonstration website.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23171311'/%3E%3Cpath d='M32 10c3 9 14 14 14 28a14 14 0 0 1-28 0c0-8 5-11 7-17 3 3 4 6 4 9 4-5 5-12 3-20z' fill='%23C76A3A'/%3E%3Cpath d='M32 34c2 4 7 6 7 12a7 7 0 0 1-14 0c0-4 4-6 7-12z' fill='%23D6A45D'/%3E%3C/svg%3E">
<script>
/* Apply saved theme/language BEFORE first paint (prevents flicker) */
(function(){try{var t=localStorage.getItem('ember_theme');if(!t){t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}
document.documentElement.setAttribute('data-theme',t);document.documentElement.lang=localStorage.getItem('ember_lang')||'en'}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Hind+Siliguri:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ THEME TOKENS ============ */
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{--ease:cubic-bezier(.2,.7,.2,1);--hf:'Playfair Display','Hind Siliguri',serif;--bf:'DM Sans','Hind Siliguri',system-ui,sans-serif}
html[lang=bn]{--hf:'Hind Siliguri','Playfair Display',serif;--bf:'Hind Siliguri','DM Sans',system-ui,sans-serif}
[data-theme=dark]{--bg:#171311;--bg2:#28201C;--card:#211A16;--tx:#F7F1E8;--mu:#A9A09A;--ac:#C76A3A;--ac2:#D6A45D;--ln:rgba(214,164,93,.2);--sh:0 22px 50px rgba(0,0,0,.45);--hdr:rgba(23,19,17,.84);--onh:#171311;--ok:#7fb98a;--bad:#e5806b}
[data-theme=light]{--bg:#F7F1E8;--bg2:#EDE3D3;--card:#FFFBF4;--tx:#241C17;--mu:#6B5F57;--ac:#B2531F;--ac2:#8F6420;--ln:rgba(40,32,28,.16);--sh:0 18px 40px rgba(70,45,25,.15);--hdr:rgba(247,241,232,.88);--onh:#fff;--ok:#2f7a45;--bad:#b3392a}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--bf);line-height:1.65;transition:background .5s,color .5s;overflow-x:hidden}
body.lock{overflow:hidden}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--hf);font-weight:600;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac2);outline-offset:3px}
.skip{position:absolute;left:-999px}.skip:focus{left:10px;top:10px;z-index:999;background:var(--ac);color:#fff;padding:8px 14px}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.mu{color:var(--mu)}
/* ============ HEADER ============ */
.hd{position:sticky;top:0;z-index:50;background:var(--hdr);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--ln);transition:background .5s}
.hd-in{display:flex;align-items:center;gap:18px;height:74px}
.logo{display:flex;align-items:center;gap:11px;text-decoration:none}
.logo svg{width:30px;height:30px;flex:none}
.logo b{display:block;font-family:'Playfair Display',serif;font-size:1.28rem;letter-spacing:.3em;font-weight:600;line-height:1.1}
.logo small{display:block;font-size:.66rem;letter-spacing:.22em;color:var(--ac2);margin-top:2px}
.nav{display:flex;gap:28px;margin-left:auto}
.nav a{text-decoration:none;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;position:relative;padding:6px 0}
.nav a:after{content:'';position:absolute;left:0;bottom:0;height:1px;width:0;background:var(--ac2);transition:width .35s var(--ease)}
.nav a:hover:after,.nav a.on:after{width:100%}
.hd-act{display:flex;align-items:center;gap:8px}
.ib{position:relative;width:42px;height:42px;display:grid;place-items:center;background:transparent;border:1px solid var(--ln);border-radius:50%;cursor:pointer;text-decoration:none;transition:.3s var(--ease)}
.ib:hover{border-color:var(--ac2);background:var(--bg2);transform:translateY(-1px)}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cnt{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;border-radius:10px;background:var(--ac);color:#fff;font-size:.68rem;font-weight:700;display:grid;place-items:center;padding:0 5px}
.cnt.bump{animation:bump .5s var(--ease)}
@keyframes bump{40%{transform:scale(1.5)}}
.lang{display:flex;border:1px solid var(--ln);border-radius:20px;overflow:hidden}
.lang button{background:none;border:0;padding:8px 12px;font-size:.78rem;font-weight:600;cursor:pointer;transition:.3s}
.lang button.on{background:var(--ac);color:#fff}
.burger{display:none}
.theme-ic .sun{display:none}[data-theme=light] .theme-ic .sun{display:block}[data-theme=light] .theme-ic .moon{display:none}
/* ============ BUTTONS / FORM ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;border:1px solid transparent;font:600 .8rem var(--bf);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:.35s var(--ease);border-radius:2px;position:relative;overflow:hidden}
.btn-p{background:var(--ac);color:#fff}
.btn-p:hover{background:var(--ac2);color:var(--onh);transform:translateY(-2px);box-shadow:0 12px 26px rgba(199,106,58,.28)}
.btn-o{border-color:var(--ac2);background:transparent}
.btn-o:hover{background:var(--ac2);color:var(--onh);transform:translateY(-2px)}
.btn.sm{padding:9px 16px;font-size:.72rem}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.btn.pulse{animation:pulse .6s}
@keyframes pulse{50%{transform:scale(.94)}}
.btn.hero-o{color:#F7F1E8;border-color:#D6A45D}
.link{background:none;border:0;color:var(--ac2);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:.88rem}
.f{margin-bottom:16px}.f label{display:block;font-size:.8rem;letter-spacing:.06em;margin-bottom:6px;color:var(--mu)}
.f input,.f select,.f textarea{width:100%;background:var(--card);border:1px solid var(--ln);padding:12px 14px;border-radius:2px;transition:.3s}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--ac2);outline:none;box-shadow:0 0 0 3px rgba(214,164,93,.18)}
.f.bad input,.f.bad select,.f.bad textarea{border-color:var(--bad)}
.f .err{color:var(--bad);font-size:.78rem;margin-top:4px;min-height:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* ============ SECTIONS ============ */
.sec{padding:96px 0}.sec.alt{background:var(--bg2);transition:background .5s}
.sec-h{max-width:640px;margin-bottom:48px}
.sec-h.c{margin-inline:auto;text-align:center}
.eyebrow{font-size:.74rem;letter-spacing:.28em;text-transform:uppercase;color:var(--ac2);margin-bottom:12px;display:flex;align-items:center;gap:12px}
.sec-h.c .eyebrow{justify-content:center}
.eyebrow:before{content:'';width:34px;height:1px;background:var(--ac2)}
.sec-h h2{font-size:clamp(1.9rem,3.6vw,2.9rem)}
.sec-h p{margin-top:14px;color:var(--mu)}
.grid{display:grid;gap:26px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.sec-top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:40px}.sec-top .sec-h{margin:0}
/* ============ HERO ============ */
.hero{position:relative;min-height:calc(100vh - 74px);display:flex;align-items:center;color:#F7F1E8;background:#171311 center/cover no-repeat;overflow:hidden}
.hero:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(23,19,17,.94) 0%,rgba(23,19,17,.7) 50%,rgba(23,19,17,.35) 100%),linear-gradient(0deg,rgba(23,19,17,.8),transparent 40%)}
.hero .wrap{position:relative;padding-top:60px;padding-bottom:80px}
.hero .tag{font-size:.78rem;letter-spacing:.34em;text-transform:uppercase;color:#D6A45D;margin-bottom:22px;opacity:0;animation:fadeUp 1s .1s var(--ease) forwards}
.hero h1{font-size:clamp(2.6rem,6.4vw,5.4rem);max-width:820px;margin-bottom:24px}
.hero h1 .ln{display:block;overflow:hidden}.hero h1 .ln span{display:block;transform:translateY(110%);animation:rise 1.1s var(--ease) forwards}
.hero h1 .ln:nth-child(2) span{animation-delay:.18s}
.hero h1 em{color:#D6A45D;font-style:italic}
.hero p.lead{max-width:540px;color:#d8cfc5;font-size:1.08rem;margin-bottom:36px;opacity:0;animation:fadeUp 1s .5s var(--ease) forwards}
.hero .cta{display:flex;gap:14px;flex-wrap:wrap;opacity:0;animation:fadeUp 1s .7s var(--ease) forwards}
.hero .scroll{position:absolute;bottom:26px;left:50%;width:1px;height:50px;background:linear-gradient(#D6A45D,transparent);animation:drip 2s infinite}
@keyframes rise{to{transform:none}}@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.page-in{animation:pageIn .6s var(--ease)}@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rv{opacity:0;transform:translateY(30px);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:var(--d,0s)}.rv.in{opacity:1;transform:none}
/* ============ FOOD CARDS ============ */
.fc{background:var(--card);border:1px solid var(--ln);display:flex;flex-direction:column;transition:transform .45s var(--ease),box-shadow .45s var(--ease),border-color .45s}
.fc:hover{transform:translateY(-6px);box-shadow:var(--sh);border-color:var(--ac2)}
.fc-img{position:relative;display:block;aspect-ratio:4/3;overflow:hidden;background:var(--bg2)}
.fc-img img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease)}.fc:hover .fc-img img{transform:scale(1.08)}
.badges{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap}
.bd{background:rgba(23,19,17,.85);color:#D6A45D;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;padding:4px 9px;border:1px solid rgba(214,164,93,.4)}
.bd.off{background:#7a2e22;color:#fff;border-color:transparent}
.fc-b{padding:20px;display:flex;flex-direction:column;gap:8px;flex:1}
.fc-cat{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ac2)}
.fc-b h3{font-size:1.2rem}.fc-b h3 a{text-decoration:none}
.fc-b p{font-size:.88rem;color:var(--mu);flex:1}
.fc-f{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.pr{font-family:var(--hf);font-size:1.25rem;color:var(--ac2);font-weight:600}
.cat-tile{position:relative;aspect-ratio:4/5;overflow:hidden;display:flex;align-items:flex-end;text-decoration:none;color:#F7F1E8}
.cat-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease)}
.cat-tile:hover img{transform:scale(1.1)}
.cat-tile:before{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(0deg,rgba(23,19,17,.92),transparent 60%)}
.cat-tile span{position:relative;z-index:2;padding:18px;font-family:var(--hf);font-size:1.15rem}
/* ============ OFFERS / INFO ============ */
.offer{border:1px solid var(--ln);padding:34px 28px;background:var(--card);position:relative;overflow:hidden;transition:.4s var(--ease)}
.offer:hover{border-color:var(--ac2);transform:translateY(-4px)}
.offer .code{display:inline-block;margin-top:14px;border:1px dashed var(--ac2);padding:5px 12px;letter-spacing:.2em;font-size:.8rem;color:var(--ac2)}
.offer h3{font-size:1.4rem;margin-bottom:8px}
.why{padding:30px 24px;border-top:2px solid var(--ac);background:var(--card)}
.why h3{font-size:1.15rem;margin-bottom:8px}.why p{color:var(--mu);font-size:.92rem}
.story{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}
.story .im{aspect-ratio:4/5;overflow:hidden;position:relative}.story .im img{width:100%;height:100%;object-fit:cover}
.story .im:after{content:'';position:absolute;inset:16px;border:1px solid var(--ac2);pointer-events:none}
.story p{color:var(--mu);margin-top:16px}
.rev{background:var(--card);border:1px solid var(--ln);padding:28px}
.rev .st{color:var(--ac2);letter-spacing:3px}.rev p{margin:12px 0;font-family:var(--hf);font-size:1.05rem}.rev small{color:var(--mu)}
.samp{display:inline-block;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--ln);padding:2px 7px;color:var(--mu);margin-left:6px}
.infoCard{background:var(--card);border:1px solid var(--ln);padding:28px}
.infoCard h3{font-size:1.2rem;margin-bottom:12px}.infoCard li{list-style:none;padding:6px 0;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;gap:12px;font-size:.92rem}.infoCard li:last-child{border:0}
.map{width:100%;height:100%;min-height:320px;border:1px solid var(--ln);filter:grayscale(.4)}
.news{display:flex;gap:10px;max-width:520px;margin:24px auto 0}.news input{flex:1;background:var(--card);border:1px solid var(--ln);padding:13px 16px}
/* ============ MENU PAGE ============ */
.pgh{padding:70px 0 40px;background:var(--bg2);border-bottom:1px solid var(--ln)}.pgh h1{font-size:clamp(2rem,4.5vw,3.4rem)}.pgh p{color:var(--mu);margin-top:10px;max-width:620px}
.tools{display:flex;gap:14px;flex-wrap:wrap;margin:34px 0 20px}
.tools input,.tools select{background:var(--card);border:1px solid var(--ln);padding:12px 14px;border-radius:2px}.tools input{flex:1;min-width:220px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:26px;scrollbar-width:thin}
.tab{flex:none;background:transparent;border:1px solid var(--ln);padding:9px 18px;font-size:.82rem;cursor:pointer;transition:.3s;white-space:nowrap}
.tab:hover{border-color:var(--ac2)}.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.empty{text-align:center;padding:70px 20px;color:var(--mu)}
/* ============ DETAIL / OPTIONS ============ */
.det{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;padding:56px 0 90px}
.det .im{aspect-ratio:1/1;overflow:hidden;border:1px solid var(--ln);position:sticky;top:100px;align-self:start}.det .im img{width:100%;height:100%;object-fit:cover}
.crumb{font-size:.8rem;color:var(--mu);margin-bottom:18px}.crumb a{text-decoration:none}.crumb a:hover{color:var(--ac2)}
.det h1{font-size:clamp(1.9rem,3.4vw,2.8rem);margin:6px 0 4px}.det .bn{color:var(--ac2);margin-bottom:14px}
.og{margin:22px 0}.og h4{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mu);margin-bottom:10px;font-family:var(--bf);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip input{position:absolute;opacity:0}
.chip span{display:inline-block;border:1px solid var(--ln);padding:8px 15px;cursor:pointer;font-size:.88rem;transition:.25s}
.chip span em{font-style:normal;color:var(--ac2);font-size:.78rem}
.chip input:checked+span{background:var(--ac);border-color:var(--ac);color:#fff}.chip input:checked+span em{color:#fff}
.chip input:focus-visible+span{outline:2px solid var(--ac2);outline-offset:2px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--ln)}.qty button{width:38px;height:38px;background:none;border:0;cursor:pointer;font-size:1.1rem;transition:.2s}.qty button:hover{background:var(--bg2)}.qty b{min-width:36px;text-align:center}
.buyrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:26px;padding-top:22px;border-top:1px solid var(--ln)}
textarea.note{width:100%;background:var(--card);border:1px solid var(--ln);padding:11px 13px;min-height:70px;resize:vertical}
/* ============ DRAWER / MODAL / TOAST ============ */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .4s;z-index:90}
body.drawer-open #scrim,body.modal-open #scrim{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;height:100%;width:min(440px,100%);background:var(--bg);z-index:100;transform:translateX(105%);transition:transform .5s var(--ease);display:flex;flex-direction:column;border-left:1px solid var(--ln);box-shadow:var(--sh)}
body.drawer-open #drawer{transform:none}
.dr-h{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--ln)}.dr-h h3{font-size:1.3rem}
.dr-b{flex:1;overflow:auto;padding:8px 24px}.dr-f{padding:20px 24px;border-top:1px solid var(--ln);background:var(--bg2)}
.line{display:grid;grid-template-columns:70px 1fr auto;gap:14px;padding:16px 0;border-bottom:1px solid var(--ln);align-items:start}
.line img{width:70px;height:70px;object-fit:cover}.line h4{font-size:1rem}.line small{display:block;color:var(--mu);font-size:.76rem;line-height:1.4;margin:2px 0 6px}
.line .qty button{width:30px;height:30px}.line .qty b{min-width:28px;font-size:.88rem}
.tot{display:flex;justify-content:space-between;padding:4px 0;font-size:.92rem}.tot.g{font-family:var(--hf);font-size:1.3rem;border-top:1px solid var(--ln);margin-top:8px;padding-top:12px;color:var(--ac2)}
.coupon{display:flex;gap:8px;margin:14px 0}.coupon input{flex:1;background:var(--card);border:1px solid var(--ln);padding:10px 12px;text-transform:uppercase}
.modal{position:fixed;inset:0;z-index:110;display:grid;place-items:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .35s}
body.modal-open .modal{opacity:1;pointer-events:auto}
.mbox{background:var(--bg);border:1px solid var(--ln);width:min(560px,100%);max-height:92vh;overflow:auto;padding:30px;transform:translateY(24px) scale(.97);transition:transform .45s var(--ease);box-shadow:var(--sh)}
body.modal-open .mbox{transform:none}.mbox.wide{width:min(760px,100%)}
.mbox h3{font-size:1.5rem;margin-bottom:16px}
.mx{float:right}
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,440px)}
.toast{background:var(--tx);color:var(--bg);padding:12px 18px;font-size:.88rem;box-shadow:var(--sh);animation:toastIn .45s var(--ease);display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%}
.toast.out{opacity:0;transform:translateY(10px);transition:.4s}.toast button{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;font-weight:700}
@keyframes toastIn{from{opacity:0;transform:translateY(20px)}}
/* ============ CHECKOUT / CONFIRM / TRACK ============ */
.demo{background:rgba(214,164,93,.12);border:1px solid var(--ln);padding:11px 16px;font-size:.84rem;margin:0 0 24px;color:var(--tx)}
.steps{display:flex;gap:10px;margin-bottom:28px;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase}.steps span{padding-bottom:8px;border-bottom:2px solid var(--ln);flex:1;color:var(--mu)}.steps span.on{border-color:var(--ac);color:var(--tx)}
.co{display:grid;grid-template-columns:1.4fr 1fr;gap:40px;padding:50px 0 90px;align-items:start}
.box{background:var(--card);border:1px solid var(--ln);padding:26px;margin-bottom:22px}.box h3{font-size:1.25rem;margin-bottom:16px}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--ln);padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:.25s}.opt:hover{border-color:var(--ac2)}.opt.on{border-color:var(--ac);background:rgba(199,106,58,.1)}.opt input{accent-color:var(--ac)}.opt small{display:block;color:var(--mu)}
.sticky{position:sticky;top:96px}
.ok-wrap{max-width:760px;margin:0 auto;padding:60px 0 90px;text-align:center}
.check{width:96px;height:96px;margin:0 auto 24px}.check circle{fill:none;stroke:var(--ac2);stroke-width:3;stroke-dasharray:290;stroke-dashoffset:290;animation:draw 1s .1s var(--ease) forwards}.check path{fill:none;stroke:var(--ac2);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .6s .9s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.ref{display:inline-block;border:1px dashed var(--ac2);padding:8px 20px;letter-spacing:.2em;color:var(--ac2);margin:12px 0 26px;font-weight:700}
.ok-wrap .box{text-align:left}
.trk{display:grid;gap:0;margin:26px 0}.trk div{display:flex;gap:16px;padding:0 0 26px 0;position:relative;color:var(--mu)}
.trk div:before{content:'';width:14px;height:14px;border-radius:50%;border:2px solid var(--ln);flex:none;margin-top:5px;background:var(--bg);z-index:1;transition:.5s}

function unit(it,l){const c=cfg(it);return it.price+(c.sz[l.size]||0)+(l.ad||[]).reduce((s,a)=>s+(ADD[a]?ADD[a].p:0),0)}
const lineKey=l=>[l.id,l.size,l.spice,[...(l.ad||[])].sort().join('+'),(l.note||'').trim()].join('|');
const cartLines=()=>S.cart.filter(l=>prod(l.id));
const cartCount=()=>cartLines().reduce((s,l)=>s+l.qty,0);
function saveCart(){store.set('cart',S.cart);refreshChrome()}
function addLine(l){const it=prod(l.id);if(!it||!it.av)return false;
 const n={id:l.id,qty:Math.min(99,Math.max(1,l.qty|0)),size:l.size|0,spice:l.spice==null?(cfg(it).sp?1:0):l.spice|0,ad:[...(l.ad||[])],note:(l.note||'').slice(0,200)};n.key=lineKey(n);
 const ex=S.cart.find(x=>x.key===n.key);if(ex)ex.qty=Math.min(99,ex.qty+n.qty);else S.cart.push(n);lastBump=true;saveCart();return true}
function optsText(it,l,lg){const c=cfg(it),p=[];if(c.sz.length>1)p.push(szLabel(c.sz.length,l.size,lg));if(c.sp)p.push(spLabel(l.spice,lg));(l.ad||[]).forEach(a=>ADD[a]&&p.push((lg||lang)==='bn'?ADD[a].bn:ADD[a].en));if(l.note)p.push('“'+l.note+'”');return p.join(' · ')}
function calc(method){method=method||CK.method;let sub=0;cartLines().forEach(l=>{sub+=unit(prod(l.id),l)*l.qty});
 const c=S.coupon&&S.coupons.find(x=>x.code===S.coupon);let disc=0;
 if(c&&sub>=c.min)disc=c.type==='pct'?Math.round(sub*c.v/100):Math.min(c.v,sub);
 const net=sub-disc;let del=0;if(cartLines().length&&method==='delivery')del=net>=S.settings.freeAbove?0:S.settings.deliveryFee;
 return{sub,disc,del,total:net+del,coupon:c||null,couponMin:!!(c&&sub<c.min)}}
function applyCoupon(code){code=(code||'').trim().toUpperCase();const c=S.coupons.find(x=>x.code===code);
 if(!c){toast(t('cBad'));return false}const sub=calc().sub;if(sub<c.min){toast(t('cMin')+' ('+money(c.min)+')');return false}
 S.coupon=code;store.set('coupon',code);toast(t('cOk')+': '+code);refreshChrome();refreshPageIfCart();return true}
function mkRef(){const d=new Date(),p=n=>String(n).padStart(2,'0');return 'EMB-'+String(d.getFullYear()).slice(2)+p(d.getMonth()+1)+p(d.getDate())+'-'+Math.random().toString(36).slice(2,6).toUpperCase()}

function validateCK(){const e={};if(CK.name.trim().length<2)e.name='eName';if(!valid.phone(CK.phone))e.phone='ePhone';if(CK.email&&!valid.email(CK.email))e.email='eEmail';

 const opt=(grp,val,title,sub)=>`<label class="opt ${CK[grp]===val?'on':''}"><input type="radio" name="${grp}" data-ckr="${grp}" value="${val}" ${CK[grp]===val?'checked':''}><span>${title}${sub?`<small>${sub}</small>`:''}</span></label>`;

 <div class="f"><label for="ck-note">${t('dnote')}</label><textarea id="ck-note" data-ck="note" rows="2">${esc(CK.note)}</textarea></div></div>`:''}</div>

 <div class="box"><h3>${t('method')}</h3><p>${CK.method==='delivery'?`${t('homeDel')}<br><span class="mu">${esc(CK.address)}, ${esc(CK.area)}, ${esc(cname)}</span>${CK.note?`<br><span class="mu">“${esc(CK.note)}”</span>`:''}`:t('pickup')}</p></div>

 <div class="box"><h3>${t('cust')}</h3><p>${esc(o.customer.name)} · ${esc(o.customer.phone)}</p>${o.method==='delivery'?`<p class="mu">${esc(o.customer.address)}, ${esc(o.customer.area)}</p>`:''}<p style="margin-top:8px">${o.method==='delivery'?t('homeDel'):t('pickup')} · ${t(o.pay)}</p><p class="mu" style="margin-top:8px">${t('est')}: ${min} ${t('mins')}</p></div>

function stageOf(o){return Math.min(5,Math.floor((Date.now()-o.ts)/20000))}

function pTrack(ref){const o=ref?findOrder(ref):null;

 <form data-form="track" style="display:flex;gap:10px;margin-bottom:24px"><input name="ref" style="flex:1;background:var(--card);border:1px solid var(--ln);padding:12px 14px" value="${esc(ref||'')}" placeholder="${t('trackPh')}" aria-label="${t('ref')}"><button class="btn btn-p" type="submit">${t('trackGo')}</button></form>
 ${ref?(o?`<div class="box"><p class="mu">${t('ref')}</p><div class="ref" style="margin:6px 0 0">${esc(o.ref)}</div><div id="trkBody">${trackBody(o)}</div></div>`:`<p class="empty">${t('noOrder')}</p>`):''}</div>`}

 else if(PTAB==='orders')body=S.orders.length?S.orders.map(o=>`<div class="box"><div class="tot"><b>${esc(o.ref)}</b><span>${new Date(o.ts).toLocaleString(lang==='bn'?'bn-BD':'en-GB')}</span></div><p class="mu">${o.items.map(i=>num(i.qty)+'× '+esc(L(i.en,i.bn))).join(', ')}</p><div class="tot g"><span>${t('total')}</span><span>${money(o.totals.total)}</span></div><a class="link" href="#/track/${esc(o.ref)}">${t('trackOrder')}</a></div>`).join(''):`<p class="empty">${t('noOrders')}</p>`;
 else body=`<div class="box"><form data-form="addr" style="display:grid;grid-template-columns:1fr 2fr auto;gap:10px;align-items:start"><input name="label" placeholder="${t('label')}" required style="background:var(--bg);border:1px solid var(--ln);padding:11px"><input name="addr" placeholder="${t('address')}" required style="background:var(--bg);border:1px solid var(--ln);padding:11px"><button class="btn btn-p sm" type="submit">${t('addAddr')}</button></form></div>${S.addrs.length?S.addrs.map((a,i)=>`<div class="box"><div class="tot"><b>${esc(a.label)}</b><span><button class="link" data-act="useAddr" data-i="${i}">${t('useAddr')}</button> · <button class="link" data-act="delAddr" data-i="${i}">${t('remove')}</button></span></div><p class="mu">${esc(a.addr)}</p></div>`).join(''):`<p class="empty">${t('noAddr')}</p>`}`;

const SAMPLE_REV=[8200,9400,7600,11200,12800,15400,10300];
function allOrders(){
 const loc=S.orders.map(o=>({ref:o.ref,name:o.customer.name,n:o.items.reduce((s,i)=>s+i.qty,0),total:o.totals.total,st:S.ost[o.ref]!=null?S.ost[o.ref]:stageOf(o),ts:o.ts,sample:false,o}));
 const smp=SAMPLE_ORDERS.map(a=>({ref:a[0],name:a[1],n:a[2],total:a[3],st:S.ost[a[0]]!=null?S.ost[a[0]]:a[4],ts:Date.now()-a[5]*864e5,sample:true}));
 return loc.concat(smp).sort((a,b)=>b.ts-a.ts)}
const sTag=s=>s?`<span class="sampleTag">${t('sample')}</span>`:'';

function ordersRows(list){return list.map(o=>`<tr><td><b>${esc(o.ref)}</b>${sTag(o.sample)}</td><td>${esc(o.name)}</td><td>${num(o.n)}</td><td>${money(o.total)}</td><td>${stSel(o)}</td><td>${dt(o.ts)}</td><td><button class="link" data-act="ordView" data-ref="${esc(o.ref)}">${t('view')}</button></td></tr>`).join('')||`<tr><td colspan="7" class="mu">${t('noRes')}</td></tr>`}

 if(el.dataset.ck){CK[el.dataset.ck]=el.value;if(CK.errors[el.dataset.ck]){delete CK.errors[el.dataset.ck];const w=el.closest('.f');if(w){w.classList.remove('bad');const er=$('.err',w);if(er)er.remove()}}}
 else if(el.dataset.ui==='q'){UI.q=el.value;$('#menuGrid').innerHTML=gridHTML();observe(true)}
 else if(el.dataset.adm==='oq'){ADM.oq=el.value;$('#admOrders').innerHTML=tbl([t('ref'),t('cust'),t('items'),t('total'),t('status'),t('date'),''],ordersRows(ordersList()))}
 else{const root=el.closest('[data-optroot]');if(root&&el.matches('textarea'))syncOpt(root)}});
document.addEventListener('change',e=>{const el=e.target,d=el.dataset;
 if(d.ck)CK[d.ck]=el.value;
 else if(d.ckr){CK[d.ckr]=el.value;render(true)}
 else if(d.ui==='sort'){UI.sort=el.value;$('#menuGrid').innerHTML=gridHTML();observe(true)}
 else if(d.adm==='ofil'){ADM.ost=el.value;$('#admOrders').innerHTML=tbl([t('ref'),t('cust'),t('items'),t('total'),t('status'),t('date'),''],ordersRows(ordersList()))}
 else if(d.adm==='ost'){S.ost[d.ref]=+el.value;store.set('ost',S.ost)}
 else if(d.adm==='price'){const p=prod(d.id);if(p&&nn(el.value)){p.price=Math.round(+el.value);store.set('products',S.products);toast(t('saved'))}}
 else if(d.adm==='av'){const p=prod(d.id);if(p){p.av=el.checked;store.set('products',S.products);render(true)}}
 else{const root=el.closest('[data-optroot]');if(root)syncOpt(root)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
document.addEventListener('click',e=>{if(document.body.classList.contains('drawer-open')||document.body.classList.contains('modal-open')){}});

/* ---------- 13. ROUTER & START ---------- */
const curRoute=()=>location.hash.replace(/^#\/?/,'').split('?')[0].split('/').map(s=>{try{return decodeURIComponent(s)}catch(e){return s}});
let io;
function observe(instant){const els=$$('.rv:not(.in)');if(instant||!('IntersectionObserver'in window)){els.forEach(x=>x.classList.add('in'));return}
 if(io)io.disconnect();io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target)}}),{threshold:.1,rootMargin:'0px 0px -30px 0px'});els.forEach(x=>io.observe(x))}
function chromeOnly(){$('#hdr').innerHTML=hdrHTML();$('#ftr').innerHTML=ftrHTML();refreshDrawer();lastBump=false}
function render(keep){clearInterval(trackTimer);const r=curRoute(),seg=r[0]||'',y=window.scrollY;
 document.body.classList.toggle('is-admin',seg==='admin');let h;
 switch(seg){case '':h=pHome();break;case 'menu':h=pMenu();break;case 'food':h=pFood(r[1]);break;case 'cart':h=pCart();break;case 'checkout':h=pCheckout();break;case 'confirm':h=pConfirm(r[1]);break;case 'track':h=pTrack(r[1]);break;
  case 'login':h=pLogin();break;case 'register':h=pRegister();break;case 'forgot':h=pForgot();break;case 'profile':h=pProfile();break;case 'about':h=pAbout();break;case 'contact':h=pContact();break;case 'faq':h=pFaq();break;
  case 'privacy':case 'terms':case 'refund':case 'delivery':h=pPolicy(seg);break;case 'admin':h=pAdmin(r[1]);break;default:h=pNF()}
 const app=$('#app');app.innerHTML=h;app.classList.remove('page-in');if(!keep){void app.offsetWidth;app.classList.add('page-in')}
 chromeOnly();observe(!!keep);document.title=(seg==='admin'?'Admin · ':'')+'THE EMBER — '+t('tagline');
 window.scrollTo(0,keep?y:0);
 if(seg==='track'&&r[1]&&findOrder(r[1]))trackTimer=setInterval(()=>{const o=findOrder(r[1]),b=$('#trkBody');if(o&&b)b.innerHTML=trackBody(o)},5000)}
window.addEventListener('hashchange',()=>{closeAll();render(false)});
render(false);
</script>
</body>
